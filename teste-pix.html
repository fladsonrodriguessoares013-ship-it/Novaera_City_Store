
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Teste PIX - NOVAERA CITY</title>
  <style>
    body {
      background: #101018;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 35px 15px;
    }
    .painel {
      background: #20202c;
      max-width: 420px;
      margin: auto;
      padding: 25px;
      border-radius: 16px;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 0;
      border-radius: 8px;
    }
    button {
      background: #00c853;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    #qr {
      width: 230px;
      max-width: 100%;
      margin: 15px auto;
      display: none;
    }
    #codigo {
      overflow-wrap: anywhere;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="painel">
    <h2>NOVAERA CITY STORE</h2>
    <p>Teste de geração PIX</p>
    <p>VIP Teste - R$ 10,00</p>

    <input
      id="email"
      type="email"
      placeholder="E-mail de teste">

    <button id="gerar" onclick="gerarPix()">
      GERAR PIX
    </button>

    <p id="status"></p>
    <img id="qr" alt="QR Code PIX">

    <p id="codigo"></p>

    <button id="copiar"
            onclick="copiarPix()"
            style="display:none">
      COPIAR CÓDIGO PIX
    </button>
  </div>

  <script>
    let codigoPix = "";

    async function gerarPix() {
      const email =
        document.getElementById("email").value.trim();
      const status =
        document.getElementById("status");
      const botao =
        document.getElementById("gerar");
      const qr =
        document.getElementById("qr");

      if (!email) {
        status.textContent = "Informe seu e-mail.";
        return;
      }

      botao.disabled = true;
      status.textContent = "Gerando PIX...";
      qr.style.display = "none";
      document.getElementById("copiar")
        .style.display = "none";
      document.getElementById("codigo")
        .textContent = "";

      try {
        const resposta = await fetch("/api/pix/criar", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            produtoId: "vip_teste",
            email: email
          })
        });

        const dados = await resposta.json();

        if (!resposta.ok) {
          throw new Error(
            dados.erro || "Erro ao gerar PIX"
          );
        }

        codigoPix = dados.qrCode || "";

        if (dados.qrCodeBase64) {
          qr.src = "data:image/png;base64," +
            dados.qrCodeBase64;
          qr.style.display = "block";
        }

        if (codigoPix) {
          document.getElementById("codigo")
            .textContent = codigoPix;
          document.getElementById("copiar")
            .style.display = "block";
        }

        status.textContent =
          codigoPix || dados.qrCodeBase64
            ? "PIX gerado para teste!"
            : "Pedido criado, mas sem QR Code. " +
              "Verifique a resposta da API.";

      } catch (erro) {
        status.textContent = erro.message;
      } finally {
        botao.disabled = false;
      }
    }

    async function copiarPix() {
      try {
        await navigator.clipboard.writeText(codigoPix);
        alert("Código PIX copiado!");
      } catch {
        alert("Não foi possível copiar o código.");
      }
    }
  </script>
</body>
</html>
